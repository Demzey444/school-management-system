<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile — SMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
(async () => {
  const user = await requireRole('ADMIN');
  if (!user) return;
  const container = renderLayout(user);

  container.innerHTML = `
    <div class="page-header"><div><h1>My Profile</h1><p>Your account information</p></div></div>
    <div id="profile" class="card">Loading…</div>
  `;

  try {
    const data = await API.get('/api/profile/me');
    document.getElementById('profile').innerHTML = `
      <table>
        <tr><th style="width:200px;">Username</th><td>${data.username}</td></tr>
        <tr><th>Email</th><td>${data.email}</td></tr>
        <tr><th>Role</th><td><span class="badge badge-grade-A">${data.role}</span></td></tr>
        <tr><th>User ID</th><td><code>${data.userId}</code></td></tr>
      </table>
    `;
  } catch (e) {
    document.getElementById('profile').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
})();
</script>
</body>
</html>
