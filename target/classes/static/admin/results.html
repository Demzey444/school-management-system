<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results — SMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
let allResults = [];
let allStudents = [];
let allSubjects = [];

(async () => {
  const user = await requireRole('ADMIN');
  if (!user) return;
  const container = renderLayout(user);
  container.innerHTML = `
    <div class="page-header">
      <div><h1>Results</h1><p>View and manage student results</p></div>
      <button class="btn btn-primary" onclick="openModal()">+ Add Result</button>
    </div>
    <div class="table-wrapper"><div id="tableArea">Loading…</div></div>
    <div id="modalArea"></div>
  `;
  await loadData();
})();

async function loadData() {
  try {
    allResults = await API.get('/api/results');
    allStudents = await API.get('/api/students');
    allSubjects = await API.get('/api/subjects');
    render();
  } catch (e) {
    document.getElementById('tableArea').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

function render() {
  const area = document.getElementById('tableArea');
  if (!allResults.length) { area.innerHTML = '<div class="empty-state">No results recorded.</div>'; return; }
  area.innerHTML = `
    <table>
      <thead><tr>
        <th>Student</th><th>Subject</th><th>Session</th><th>Term</th>
        <th>Test</th><th>Exam</th><th>Total</th><th>Grade</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${allResults.map(r => `
          <tr>
            <td>${r.studentName||''}<br><small>${r.admissionNumber||''}</small></td>
            <td>${r.subjectName||''}</td>
            <td>${r.session}</td>
            <td>${r.term}</td>
            <td>${r.testScore}</td>
            <td>${r.examScore}</td>
            <td><strong>${r.totalScore}</strong></td>
            <td><span class="badge badge-grade-${r.grade}">${r.grade}</span></td>
            <td class="row-flex">
              <button class="btn btn-sm btn-danger" onclick="deleteResult('${r.id}')">Delete</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function openModal() {
  document.getElementById('modalArea').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>Add Result</h2>
        <div id="modalAlert"></div>
        <form id="resultForm">
          <div class="form-group"><label>Student</label>
            <select name="studentId" required>
              <option value="">— Select —</option>
              ${allStudents.map(s => `<option value="${s.id}">${s.fullName} (${s.admissionNumber})</option>`).join('')}
            </select></div>
          <div class="form-group"><label>Subject</label>
            <select name="subjectId" required>
              <option value="">— Select —</option>
              ${allSubjects.map(s => `<option value="${s.id}">${s.name} (${s.className||''})</option>`).join('')}
            </select></div>
          <div class="form-row">
            <div class="form-group"><label>Session</label>
              <input name="session" placeholder="2025/2026" required value="2025/2026"></div>
            <div class="form-group"><label>Term</label>
              <select name="term" required>
                <option value="FIRST">First</option>
                <option value="SECOND">Second</option>
                <option value="THIRD">Third</option>
              </select></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Test Score (0-40)</label>
              <input type="number" name="testScore" min="0" max="40" required></div>
            <div class="form-group"><label>Exam Score (0-60)</label>
              <input type="number" name="examScore" min="0" max="60" required></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('resultForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const form = new FormData(ev.target);
    const body = {
      studentId: form.get('studentId'),
      subjectId: form.get('subjectId'),
      session: form.get('session'),
      term: form.get('term'),
      testScore: parseInt(form.get('testScore')),
      examScore: parseInt(form.get('examScore'))
    };
    try {
      await API.post('/api/results', body);
      closeModal(); await loadData();
    } catch (e) {
      document.getElementById('modalAlert').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    }
  });
}
function closeModal() { document.getElementById('modalArea').innerHTML = ''; }
async function deleteResult(id) {
  if (!confirm('Delete this result?')) return;
  try { await API.delete('/api/results/' + id); await loadData(); }
  catch (e) { alert(e.message); }
}
</script>
</body>
</html>
