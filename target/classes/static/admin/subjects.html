<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subjects — SMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
let allSubjects = [];
let allClasses = [];
let allTeachers = [];

(async () => {
  const user = await requireRole('ADMIN');
  if (!user) return;
  const container = renderLayout(user);
  container.innerHTML = `
    <div class="page-header">
      <div><h1>Subjects</h1><p>Manage subjects and assign teachers</p></div>
      <button class="btn btn-primary" onclick="openModal()">+ Add Subject</button>
    </div>
    <div class="toolbar">
      <select id="classFilter"><option value="">All classes</option></select>
    </div>
    <div class="table-wrapper"><div id="tableArea">Loading…</div></div>
    <div id="modalArea"></div>
  `;
  document.getElementById('classFilter').addEventListener('change', render);
  await loadData();
})();

async function loadData() {
  try {
    allSubjects = await API.get('/api/subjects');
    allClasses = await API.get('/api/classes');
    allTeachers = await API.get('/api/teachers');
    const f = document.getElementById('classFilter');
    f.innerHTML = '<option value="">All classes</option>' +
      allClasses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    render();
  } catch (e) {
    document.getElementById('tableArea').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

function render() {
  const cf = document.getElementById('classFilter').value;
  let list = allSubjects;
  if (cf) list = list.filter(s => s.classId === cf);
  const area = document.getElementById('tableArea');
  if (!list.length) { area.innerHTML = '<div class="empty-state">No subjects yet.</div>'; return; }
  area.innerHTML = `
    <table>
      <thead><tr><th>Code</th><th>Name</th><th>Class</th><th>Teacher</th><th>Actions</th></tr></thead>
      <tbody>
        ${list.map(s => `
          <tr>
            <td>${s.code}</td>
            <td>${s.name}</td>
            <td>${s.className||'—'}</td>
            <td>${s.teacherName||'—'}</td>
            <td class="row-flex">
              <button class="btn btn-sm btn-secondary" onclick='editSubject(${JSON.stringify(s).replace(/'/g,"&apos;")})'>Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteSubject('${s.id}','${s.name}')">Delete</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function openModal(s) {
  const sub = s || {};
  const isEdit = !!sub.id;
  document.getElementById('modalArea').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>${isEdit ? 'Edit' : 'Add'} Subject</h2>
        <div id="modalAlert"></div>
        <form id="subjectForm">
          <div class="form-row">
            <div class="form-group"><label>Code</label>
              <input name="code" value="${sub.code||''}" required></div>
            <div class="form-group"><label>Name</label>
              <input name="name" value="${sub.name||''}" required></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Class</label>
              <select name="classId">
                <option value="">—</option>
                ${allClasses.map(c => `<option value="${c.id}" ${sub.classId===c.id?'selected':''}>${c.name}</option>`).join('')}
              </select></div>
            <div class="form-group"><label>Teacher</label>
              <select name="teacherId">
                <option value="">—</option>
                ${allTeachers.map(t => `<option value="${t.id}" ${sub.teacherId===t.id?'selected':''}>${t.fullName}</option>`).join('')}
              </select></div>
          </div>
          <div class="form-group"><label>Description</label>
            <input name="description" value="${sub.description||''}"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">${isEdit ? 'Save' : 'Create'}</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('subjectForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const form = new FormData(ev.target);
    const body = {
      code: form.get('code'),
      name: form.get('name'),
      classId: form.get('classId') || null,
      teacherId: form.get('teacherId') || null,
      description: form.get('description') || null
    };
    try {
      if (isEdit) await API.put('/api/subjects/' + sub.id, body);
      else await API.post('/api/subjects', body);
      closeModal(); await loadData();
    } catch (e) {
      document.getElementById('modalAlert').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    }
  });
}
function editSubject(s) { openModal(s); }
function closeModal() { document.getElementById('modalArea').innerHTML = ''; }
async function deleteSubject(id, name) {
  if (!confirm(`Delete subject "${name}"?`)) return;
  try { await API.delete('/api/subjects/' + id); await loadData(); }
  catch (e) { alert(e.message); }
}
</script>
</body>
</html>
