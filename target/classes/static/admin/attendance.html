<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendance — SMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
let allAttendance = [];
let allClasses = [];

(async () => {
  const user = await requireRole('ADMIN');
  if (!user) return;
  const container = renderLayout(user);
  container.innerHTML = `
    <div class="page-header">
      <div><h1>Attendance</h1><p>View attendance records</p></div>
    </div>
    <div class="toolbar">
      <select id="classFilter"><option value="">All classes</option></select>
      <input type="date" id="dateFilter">
      <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Clear</button>
    </div>
    <div class="table-wrapper"><div id="tableArea">Loading…</div></div>
  `;
  document.getElementById('classFilter').addEventListener('change', loadData);
  document.getElementById('dateFilter').addEventListener('change', loadData);
  await loadData();
})();

async function loadData() {
  try {
    allClasses = await API.get('/api/classes');
    const f = document.getElementById('classFilter');
    const current = f.value;
    f.innerHTML = '<option value="">All classes</option>' +
      allClasses.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    f.value = current;

    const classId = f.value;
    const date = document.getElementById('dateFilter').value;
    let url = '/api/attendance';
    const params = [];
    if (classId) params.push('classId=' + classId);
    if (date) params.push('date=' + date);
    if (params.length) url += '?' + params.join('&');

    allAttendance = await API.get(url);
    render();
  } catch (e) {
    document.getElementById('tableArea').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

function render() {
  const area = document.getElementById('tableArea');
  if (!allAttendance.length) { area.innerHTML = '<div class="empty-state">No attendance records.</div>'; return; }
  area.innerHTML = `
    <table>
      <thead><tr>
        <th>Date</th><th>Student</th><th>Admission #</th><th>Class</th><th>Status</th><th>Remark</th>
      </tr></thead>
      <tbody>
        ${allAttendance.map(a => `
          <tr>
            <td>${a.date}</td>
            <td>${a.studentName||''}</td>
            <td>${a.admissionNumber||''}</td>
            <td>${a.className||'—'}</td>
            <td><span class="badge badge-${a.status.toLowerCase()}">${a.status}</span></td>
            <td>${a.remark||'—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function clearFilters() {
  document.getElementById('classFilter').value = '';
  document.getElementById('dateFilter').value = '';
  loadData();
}
</script>
</body>
</html>
