<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teachers — SMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
let allTeachers = [];

(async () => {
  const user = await requireRole('ADMIN');
  if (!user) return;
  const container = renderLayout(user);

  container.innerHTML = `
    <div class="page-header">
      <div><h1>Teachers</h1><p>Manage teacher records</p></div>
      <button class="btn btn-primary" onclick="openModal()">+ Add Teacher</button>
    </div>
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search by name, staff number, or email…">
    </div>
    <div class="table-wrapper"><div id="tableArea">Loading…</div></div>
    <div id="modalArea"></div>
  `;

  document.getElementById('search').addEventListener('input', render);
  await loadData();
})();

async function loadData() {
  try {
    allTeachers = await API.get('/api/teachers');
    render();
  } catch (e) {
    document.getElementById('tableArea').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = allTeachers;
  if (q) list = list.filter(t =>
    (t.fullName||'').toLowerCase().includes(q) ||
    (t.staffNumber||'').toLowerCase().includes(q) ||
    (t.email||'').toLowerCase().includes(q));

  const area = document.getElementById('tableArea');
  if (!list.length) {
    area.innerHTML = '<div class="empty-state">No teachers found.</div>';
    return;
  }
  area.innerHTML = `
    <table>
      <thead><tr>
        <th>Staff #</th><th>Name</th><th>Email</th><th>Phone</th><th>Gender</th><th>Qualification</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${list.map(t => `
          <tr>
            <td>${t.staffNumber||''}</td>
            <td>${t.fullName||''}</td>
            <td>${t.email||''}</td>
            <td>${t.phone||''}</td>
            <td>${t.gender||''}</td>
            <td>${t.qualification||''}</td>
            <td class="row-flex">
              <button class="btn btn-sm btn-secondary" onclick='editTeacher(${JSON.stringify(t).replace(/'/g,"&apos;")})'>Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteTeacher('${t.id}','${t.fullName}')">Delete</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function openModal(teacher) {
  const t = teacher || {};
  const isEdit = !!t.id;

  document.getElementById('modalArea').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>${isEdit ? 'Edit' : 'Add'} Teacher</h2>
        <div id="modalAlert"></div>
        <form id="teacherForm">
          <div class="form-row">
            <div class="form-group"><label>Staff Number</label>
              <input name="staffNumber" value="${t.staffNumber||''}" required></div>
            <div class="form-group"><label>Full Name</label>
              <input name="fullName" value="${t.fullName||''}" required></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Email</label>
              <input type="email" name="email" value="${t.email||''}" required></div>
            <div class="form-group"><label>Phone</label>
              <input name="phone" value="${t.phone||''}"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Gender</label>
              <select name="gender" required>
                <option value="">—</option>
                <option value="MALE" ${t.gender==='MALE'?'selected':''}>Male</option>
                <option value="FEMALE" ${t.gender==='FEMALE'?'selected':''}>Female</option>
              </select></div>
            <div class="form-group"><label>Qualification</label>
              <input name="qualification" value="${t.qualification||''}"></div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">${isEdit ? 'Save Changes' : 'Create'}</button>
          </div>
        </form>
      </div>
    </div>
  `;

  document.getElementById('teacherForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const form = new FormData(ev.target);
    const body = {
      staffNumber: form.get('staffNumber'),
      fullName: form.get('fullName'),
      email: form.get('email'),
      phone: form.get('phone') || null,
      gender: form.get('gender'),
      qualification: form.get('qualification') || null,
      subjectIds: t.subjectIds || [],
      classIds: t.classIds || []
    };

    try {
      if (isEdit) {
        await API.put('/api/teachers/' + t.id, body);
      } else {
        await API.post('/api/teachers', body);
      }
      closeModal();
      await loadData();
    } catch (e) {
      document.getElementById('modalAlert').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    }
  });
}

function editTeacher(t) { openModal(t); }
function closeModal() { document.getElementById('modalArea').innerHTML = ''; }

async function deleteTeacher(id, name) {
  if (!confirm(`Delete teacher "${name}"?`)) return;
  try {
    await API.delete('/api/teachers/' + id);
    await loadData();
  } catch (e) { alert(e.message); }
}
</script>
</body>
</html>
