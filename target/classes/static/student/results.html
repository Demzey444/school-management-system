<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Results — SMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
(async () => {
  const user = await requireRole('STUDENT');
  if (!user) return;
  const container = renderLayout(user);

  container.innerHTML = `
    <div class="page-header">
      <div><h1>My Results</h1><p>Report card by session and term</p></div>
    </div>
    <div class="card">
      <div class="form-row">
        <div class="form-group"><label>Session</label>
          <input type="text" id="session" value="2025/2026"></div>
        <div class="form-group"><label>Term</label>
          <select id="term">
            <option value="FIRST">First</option>
            <option value="SECOND">Second</option>
            <option value="THIRD">Third</option>
          </select></div>
      </div>
      <button class="btn btn-primary" onclick="loadReport()">View Report Card</button>
    </div>
    <div id="reportArea"></div>
  `;
  await loadReport();
})();

async function loadReport() {
  const session = document.getElementById('session').value;
  const term = document.getElementById('term').value;
  const area = document.getElementById('reportArea');
  area.innerHTML = 'Loading…';

  try {
    const user = await getCurrentUser();
    const r = await API.get(`/api/results/report/${user.profileId}?session=${session}&term=${term}`);

    if (!r.results || !r.results.length) {
      area.innerHTML = '<div class="empty-state">No results recorded for this term yet.</div>';
      return;
    }

    area.innerHTML = `
      <div class="card">
        <div class="page-header" style="margin-bottom:16px;">
          <div>
            <h2 style="font-size:18px;">${r.studentName}</h2>
            <p>${r.admissionNumber} • ${r.className||''} • ${r.session} • ${r.term}</p>
          </div>
        </div>
        <table>
          <thead><tr>
            <th>Subject</th><th>Test</th><th>Exam</th><th>Total</th><th>Grade</th><th>Remark</th>
          </tr></thead>
          <tbody>
            ${r.results.map(x => `
              <tr>
                <td>${x.subjectName}</td>
                <td>${x.testScore}</td>
                <td>${x.examScore}</td>
                <td><strong>${x.totalScore}</strong></td>
                <td><span class="badge badge-grade-${x.grade}">${x.grade}</span></td>
                <td>${x.remark}</td>
              </tr>
            `).join('')}
          </tbody>
          <tfoot>
            <tr>
              <th style="text-align:left;">Summary</th>
              <th colspan="2"></th>
              <th>${r.totalScore}</th>
              <th colspan="2">Average: ${r.average} — ${r.overallGrade}</th>
            </tr>
          </tfoot>
        </table>
      </div>
    `;
  } catch (e) {
    area.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}
</script>
</body>
</html>
