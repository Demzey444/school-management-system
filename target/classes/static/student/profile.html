<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile — SMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
(async () => {
  const user = await requireRole('STUDENT');
  if (!user) return;
  const container = renderLayout(user);

  container.innerHTML = `
    <div class="page-header"><div><h1>My Profile</h1><p>Your account information</p></div></div>
    <div id="profile" class="card">Loading…</div>
  `;

  try {
    const d = await API.get('/api/profile/me');
    const p = d.profile || {};
    document.getElementById('profile').innerHTML = `
      <table>
        <tr><th style="width:200px;">Full Name</th><td>${p.fullName||'—'}</td></tr>
        <tr><th>Admission Number</th><td>${p.admissionNumber||'—'}</td></tr>
        <tr><th>Email</th><td>${p.email||'—'}</td></tr>
        <tr><th>Phone</th><td>${p.phone||'—'}</td></tr>
        <tr><th>Gender</th><td>${p.gender||'—'}</td></tr>
        <tr><th>Date of Birth</th><td>${p.dateOfBirth||'—'}</td></tr>
        <tr><th>Class</th><td>${p.className||'—'}</td></tr>
        <tr><th>Address</th><td>${p.address||'—'}</td></tr>
        <tr><th>Role</th><td><span class="badge badge-grade-A">${d.role}</span></td></tr>
      </table>
    `;
  } catch (e) {
    document.getElementById('profile').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
})();
</script>
</body>
</html>
