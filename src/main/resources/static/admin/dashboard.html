<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard — SMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
(async () => {
  const user = await requireRole('ADMIN');
  if (!user) return;
  const container = renderLayout(user);

  container.innerHTML = `
    <div class="page-header">
      <div>
        <h1>Admin Dashboard</h1>
        <p>Overview of the school</p>
      </div>
    </div>
    <div id="stats" class="stat-grid">Loading…</div>
  `;

  try {
    const stats = await API.get('/api/dashboard/admin');
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total Students</div><div class="stat-value">${stats.totalStudents}</div></div>
      <div class="stat-card"><div class="stat-label">Total Teachers</div><div class="stat-value">${stats.totalTeachers}</div></div>
      <div class="stat-card"><div class="stat-label">Total Classes</div><div class="stat-value">${stats.totalClasses}</div></div>
      <div class="stat-card"><div class="stat-label">Total Subjects</div><div class="stat-value">${stats.totalSubjects}</div></div>
      <div class="stat-card"><div class="stat-label">Results Recorded</div><div class="stat-value">${stats.totalResults}</div></div>
      <div class="stat-card"><div class="stat-label">Attendance Records</div><div class="stat-value">${stats.totalAttendance}</div></div>
    `;
  } catch (e) {
    document.getElementById('stats').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
})();
</script>
</body>
</html>
