<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Greenfield International School</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🌿</div>
        <h1>Greenfield International</h1>
        <p>Sign in to continue to your dashboard</p>
      </div>

      <div id="alert" class="alert alert-error hidden"></div>

      <form id="loginForm" autocomplete="on">
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
          Sign In
        </button>
      </form>

      <div class="login-divider"><span>Demo Accounts</span></div>

      <div class="demo-grid">
        <button type="button" class="demo-chip" onclick="fillLogin('admin','school@2026')">
          <span class="demo-role">Admin</span>
          <span class="demo-user">admin</span>
        </button>
        <button type="button" class="demo-chip" onclick="fillLogin('teacher','teacher123')">
          <span class="demo-role">Teacher</span>
          <span class="demo-user">teacher</span>
        </button>
        <button type="button" class="demo-chip" onclick="fillLogin('student','student123')">
          <span class="demo-role">Student</span>
          <span class="demo-user">student</span>
        </button>
      </div>
    </div>

    <p class="login-footer">© 2026 Greenfield International School</p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      const user = await getCurrentUser();
      if (user) redirectToDashboard(user.role);
    })();

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePassword.classList.toggle('is-visible', isPassword);
    });

    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    window.fillLogin = function(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const body = {
          username: document.getElementById('username').value.trim(),
          password: passwordInput.value
        };
        const user = await API.post('/api/auth/login', body);
        redirectToDashboard(user.role);
      } catch (err) {
        showError(err.status === 401 ? 'Invalid username or password' : err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
